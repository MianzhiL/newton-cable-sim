[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cable-robot-sample"
version = "0.1.0"
description = "Isaac Lab and Newton cable manipulation sample"
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "Pillow>=10", "matplotlib>=3.8"]

[project.scripts]
cable-sample = "cable_robot_sample.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
cable_robot_sample = ["*.json", "learning/*.json"]
